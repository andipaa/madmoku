      <circle cx="-20" cy="0" r="4" fill="#FF97BF" opacity=".8"/><circle cx="8" cy="-6" r="3" fill="#FF97BF" opacity=".7"/><circle cx="28" cy="6" r="4" fill="#FF97BF" opacity=".8"/>
